services:
  db:
    image: postgres:16-alpine
    container_name: estacionamento-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: estacionamento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estacionamento"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./est
      dockerfile: Dockerfile
    container_name: estacionamento-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/estacionamento
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_JPA_DDL_AUTO: update
      JWT_SECRET: estacionamento-secret-key-2026
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
